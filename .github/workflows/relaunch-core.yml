name: Relaunch core

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  core:
    name: Application, financial and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:core
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm run check:design
      - run: npm run db:generate-auth
      - run: git diff --exit-code -- db/migrations/0003_auth.generated.sql
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  container:
    name: Portable container smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cgt-tracker:test .
      - name: Run as an unprivileged service without build-time secrets
        run: |
          test "$(docker run --rm --entrypoint id cgt-tracker:test -u)" = "1000"
          docker run --detach --name cgt-smoke --publish 127.0.0.1:3300:3000 cgt-tracker:test
          trap 'docker rm --force cgt-smoke >/dev/null' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:3300/api/health
          curl --fail http://127.0.0.1:3300/ --output /tmp/cgt-home.html
          node -e 'if (!require("node:fs").readFileSync("/tmp/cgt-home.html", "utf8").includes("Calculate your Capital Gains Tax")) process.exit(1)'
          test "$(curl --silent --output /tmp/cgt-setup.json --write-out '%{http_code}' http://127.0.0.1:3300/api/v2/auth/get-session)" = "503"
          test "$(curl --silent --output /tmp/cgt-ready.json --write-out '%{http_code}' http://127.0.0.1:3300/api/ready)" = "503"

  postgres:
    name: PostgreSQL 18 migrations, roles and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-owner-password
          POSTGRES_DB: cgt_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cgt_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:postgres
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-owner-password@localhost:5432/cgt_qualification
      - name: Rehearse PostgreSQL 18 backup restoration
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc cgt_qualification > /tmp/cgt-qualification.dump
          docker exec "$PG_CONTAINER" createdb -U postgres cgt_restore_qualification
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres --exit-on-error -d cgt_restore_qualification < /tmp/cgt-qualification.dump
          for database in cgt_qualification cgt_restore_qualification; do
            docker exec "$PG_CONTAINER" psql -U postgres -d "$database" -At -c "SELECT 'transactions',count(*),md5(coalesce(string_agg(row_to_json(t)::text,'' ORDER BY id),'')) FROM cgt.transactions t UNION ALL SELECT 'imports',count(*),md5(coalesce(string_agg(row_to_json(i)::text,'' ORDER BY id),'')) FROM cgt.imports i UNION ALL SELECT 'runs',count(*),md5(coalesce(string_agg(row_to_json(r)::text,'' ORDER BY id),'')) FROM cgt.calculation_runs r UNION ALL SELECT 'users',count(*),md5(coalesce(string_agg(row_to_json(u)::text,'' ORDER BY id),'')) FROM auth.\"user\" u;" > "/tmp/$database-check.txt"
          done
          diff /tmp/cgt_qualification-check.txt /tmp/cgt_restore_qualification-check.txt
          test "$(docker exec "$PG_CONTAINER" psql -U postgres -d cgt_restore_qualification -At -c 'SET ROLE cgt_app; SELECT count(*) FROM cgt.transactions;' | tail -1)" = "0"
          rm /tmp/cgt-qualification.dump
