name: Relaunch core

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  core:
    name: Application, financial and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:core
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm run check:design
      - run: npm run db:generate-auth
      - run: git diff --exit-code -- db/migrations/0003_auth.generated.sql
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
